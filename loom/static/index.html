<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loom</title>
<style>
  :root{
    --bg:#0f1013; --panel:#16181d; --panel2:#1b1e25; --border:#262a31;
    --text:#d7dae0; --muted:#868c98; --accent:#c9905a;
    --place:#4ea1a1; --character:#6f8fd8; --faction:#d8a34e; --event:#d87a6a; --lore:#8a8f98;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{margin:0;font-size:16px;letter-spacing:.5px;color:var(--accent);font-weight:600}
  header .meta{color:var(--muted);font-size:12px}
  #worldsel{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:2px 6px;font:inherit;font-size:12px;cursor:pointer}
  header .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:5px;vertical-align:middle}
  header .dot.ok{background:#5aa469} header .dot.bad{background:#c0564a}
  .wrap{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 45px)}
  .story{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
  #log{flex:1;overflow-y:auto;padding:18px 22px}
  .turn{margin:0 0 18px}
  .turn.player{color:var(--muted)}
  .turn.player::before{content:"› ";color:var(--accent)}
  .turn.narrator{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;color:#e7e3da}
  .turn.narrator p{margin:0 0 .8em}
  .turn.sys{color:var(--event);font-size:12px;font-style:italic}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--panel)}
  #input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
         border-radius:6px;padding:9px 11px;font:inherit;resize:none}
  button{background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:0 16px;
         font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .world{display:flex;flex-direction:column;min-width:0}
  .worldbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
  svg{width:100%;flex:1;display:block;background:radial-gradient(circle at 50% 40%,#14161c,#0f1013)}
  .node circle{cursor:pointer;stroke:#0f1013;stroke-width:1.5}
  .node text{fill:var(--text);font-size:11px;pointer-events:none}
  .edge{stroke:#333944;stroke-width:1}
  #reader{height:38%;border-top:1px solid var(--border);overflow-y:auto;padding:14px 18px;background:var(--panel)}
  #reader h2{margin:0 0 4px;font-size:14px;color:var(--accent)}
  #reader .kind{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  #reader .body{font-family:Georgia,serif;font-size:14px;line-height:1.65;color:#ded9cf}
  #reader .body p{margin:0 0 .7em}
  #reader a{color:var(--place);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--place)}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .fact{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:12px}
  .fact b{color:var(--accent);font-weight:600}
  .thread{margin:8px 0}
  .tq{font-size:12.5px;color:var(--text);line-height:1.35}
  .tbar{height:4px;background:var(--panel2);border-radius:3px;margin:4px 0 2px;overflow:hidden}
  .tfill{height:100%;background:var(--accent)}
  .tstatus{font-size:11px;color:var(--muted)}
  .warn{margin-top:12px;color:var(--event);font-size:12px}
  .crow{font-size:12.5px;margin:3px 0;color:var(--text)}
  .clabel{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;margin-right:4px}
  .mini{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:1px 7px;font:inherit;font-size:11px;cursor:pointer;margin-left:10px}
  .tctl{float:right;cursor:pointer;color:var(--muted);font-size:12px}
  .tctl a{color:var(--muted);cursor:pointer}
  .addlink{cursor:pointer;color:var(--accent)}
  .edit label{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin:9px 0 2px}
  .edit input,.edit select,.edit textarea{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px;font:inherit;font-size:13px}
  .edit textarea{min-height:120px;resize:vertical;font-family:Georgia,serif;line-height:1.5}
  .edit .row{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>loom</h1>
  <select id="worldsel" class="meta" title="switch world"></select>
  <a class="mini" style="margin-left:14px" onclick="editPlayer()" title="Your character in this world">You</a>
  <a class="mini" style="margin-left:12px" onclick="genWorld()" title="Roll a new world from a prompt">✦ Generate</a>
  <a class="mini" style="margin-left:12px" onclick="editSettings()" title="Depth, world round, dice">⚙</a>
  <span class="meta" style="margin-left:auto"><span class="dot" id="mdot"></span><span id="model">…</span></span>
</header>
<div class="wrap">
  <section class="story">
    <div id="log"></div>
    <form id="f">
      <input id="input" autocomplete="off" placeholder="What do you do?">
      <button id="send" type="submit">Send</button>
      <button id="consolidate" class="ghost" type="button" title="Fold this session into canon">Consolidate</button>
      <button id="imagine" class="ghost" type="button" title="Dream a new thread from the canon">Imagine</button>
      <button id="sleep" class="ghost" type="button" title="Let the world turn while you're away">Sleep</button>
    </form>
  </section>
  <section class="world">
    <div class="worldbar"><span id="worldcount">world</span><a class="mini" onclick="editNode('')">＋ node</a><span style="margin-left:auto" id="legend"></span></div>
    <svg id="graph" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="reader"><div class="kind">continuity</div><div id="facts" class="facts"></div></div>
  </section>
</div>
<script>
const KINDS={place:"#4ea1a1",character:"#6f8fd8",faction:"#d8a34e",event:"#d87a6a",lore:"#8a8f98"};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $=id=>document.getElementById(id);

function mdToHtml(t){
  t=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
          .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,n,a)=>`<a onclick="openNode('${n.replace(/'/g,"")}')">${a||n}</a>`);
  return t.split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}

function _eb(nm){const s=nm.replace(/'/g,"\\'");return `<div class="tctl"><a onclick="editNode('${s}')">edit</a> · <a onclick="delNode('${s}')">✕</a></div>`;}
async function openNode(name){
  const r=await fetch("/api/node?name="+encodeURIComponent(name));
  if(!r.ok) return;
  const n=await r.json();
  if(n.card){
    const c=n.card, row=(l,v)=>v?`<div class="crow"><span class="clabel">${l}</span> ${esc(v)}</div>`:"";
    $("reader").innerHTML=_eb(c.name)+`<h2>${esc(c.name)}</h2><div class="kind">character${c.role?" · "+esc(c.role):""}</div>`+
      row("met",c.met)+row("wants",c.want)+row("held by",c.bound)+row("voice",c.voice)+row("toward you",c.disposition)+
      `<div class="body" style="margin-top:10px">${mdToHtml(c.description)}</div>`;
    return;
  }
  $("reader").innerHTML=_eb(n.name)+`<h2>${esc(n.name)}</h2><div class="kind">${esc(n.kind)}</div>`+
    `<div class="body">${mdToHtml(n.body)}</div>`;
}

// ---- authoring: native editing, no external editor needed ----
function _field(l,id,v,tag){return `<label>${l}</label>`+(tag==="textarea"?`<textarea id="${id}">${esc(v||"")}</textarea>`:`<input id="${id}" value="${esc(v||"")}">`);}
function _charFields(c){return _field("role","f_role",c.role)+_field("met","f_met",c.met)+_field("voice","f_voice",c.voice)+_field("disposition","f_disp",c.disposition)+_field("wants","f_wants",c.want)+_field("held by","f_bound",c.bound);}
function _loreFields(f){return `<div class="kind" style="margin:6px 0">world card (the theme this scene is written in)</div>`+_field("genre","f_genre",f.genre)+_field("age","f_age",f.age)+_field("tech","f_tech",f.tech)+_field("magic","f_magic",f.magic)+_field("peoples","f_peoples",f.peoples)+_field("tone","f_tone",f.tone);}
function _xfields(kind,c,f){return kind==="character"?_charFields(c):kind==="lore"?_loreFields(f||{}):"";}
async function editNode(name){
  const n=name?await (await fetch("/api/node?name="+encodeURIComponent(name))).json():{name:"",kind:"lore",body:"",card:{},fields:{}};
  const c=n.card||{}, f=n.fields||{}, kinds=["lore","place","character","faction","event"];
  const cancel=name?`openNode('${name.replace(/'/g,"\\'")}')`:"loadState()";
  $("reader").innerHTML=`<div class="edit"><h2>${name?esc(name):"new node"}</h2>`+
    (name?"":_field("name","f_name","","input"))+
    `<label>kind</label><select id="f_kind">`+kinds.map(k=>`<option${k===n.kind?" selected":""}>${k}</option>`).join("")+`</select>`+
    `<div id="xfields">`+_xfields(n.kind,c,f)+`</div>`+
    _field("description","f_body",n.body||c.description||"","textarea")+
    `<div class="row"><button onclick="saveNode('${(name||"").replace(/'/g,"\\'")}')">Save</button>`+
    `<button class="ghost" onclick="${cancel}">Cancel</button></div></div>`;
  $("f_kind").onchange=()=>{$("xfields").innerHTML=_xfields($("f_kind").value,c,f);};
}
async function saveNode(orig){
  const name=orig||($("f_name")?$("f_name").value.trim():""); if(!name) return;
  const kind=$("f_kind").value, fields={};
  if(kind==="character") for(const [k,id] of [["role","f_role"],["met","f_met"],["voice","f_voice"],["disposition","f_disp"],["wants","f_wants"],["bound","f_bound"]]){const el=$(id); if(el&&el.value.trim()) fields[k]=el.value.trim();}
  if(kind==="lore"){for(const [k,id] of [["genre","f_genre"],["age","f_age"],["tech","f_tech"],["magic","f_magic"],["peoples","f_peoples"],["tone","f_tone"]]){const el=$(id); if(el&&el.value.trim()) fields[k]=el.value.trim();} if(Object.keys(fields).length) fields.setting="true";}
  await fetch("/api/node/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,kind,body:$("f_body").value,fields})});
  await loadState(); openNode(name);
}
// ---- player character, world generation, session settings, sleep ----
async function editPlayer(){
  const p=await (await fetch("/api/player")).json();
  $("reader").innerHTML=`<div class="edit"><h2>Your character</h2><div class="kind">who you are in this world — the narrator will know you</div>`+
    _field("name","p_name",p.name||"","input")+_field("role","p_role",p.role||"","input")+
    _field("wants","p_wants",p.wants||"","input")+_field("where you start","p_loc",p.location||"","input")+
    _field("description","p_desc",p.description||"","textarea")+
    `<div class="row"><button onclick="savePlayer()">Save</button><button class="ghost" onclick="loadState()">Cancel</button></div></div>`;
}
async function savePlayer(){
  const name=$("p_name").value.trim(); if(!name){return;}
  await fetch("/api/player/save",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,role:$("p_role").value,wants:$("p_wants").value,location:$("p_loc").value,description:$("p_desc").value})});
  await loadState(); addTurn("sys",`you are now ${esc(name)}. the world knows you.`);
}
async function genWorld(){
  $("reader").innerHTML=`<div class="edit"><h2>✦ Generate a world</h2><div class="kind">a base prompt, or leave blank to roll random</div>`+
    _field("prompt / seed","g_seed","","textarea")+
    `<div class="row"><button onclick="rollWorld()">Roll</button><button class="ghost" onclick="loadState()">Cancel</button></div><div id="g_out"></div></div>`;
}
async function rollWorld(){
  $("g_out").innerHTML="<div class='kind' style='margin-top:10px'>rolling… (a few seconds)</div>";
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({seed:$("g_seed").value.trim()})});
  const j=await r.json();
  if(!r.ok||!j.world||!j.world.name){$("g_out").innerHTML="<div class='kind'>the roll came up empty — try again.</div>";return;}
  const w=j.world, row=(l,v)=>v?`<div class="crow"><span class="clabel">${l}</span> ${esc(v)}</div>`:"";
  window._rolled={world:w,cast:j.cast||[]};
  $("g_out").innerHTML=`<h2 style="margin-top:14px">${esc(w.name)}</h2><div class="kind">${esc(w.genre||"")}</div><div class="body">${esc(w.premise||"")}</div>`+
    row("age",w.age)+row("tech",w.tech)+row("magic",w.magic)+row("peoples",w.peoples)+row("tone",w.tone)+
    `<div class="body" style="margin-top:8px">${esc(w.body||"")}</div><div class="kind" style="margin-top:10px">CAST</div>`+
    (j.cast||[]).map(c=>`<div class="crow"><b>${esc(c.name)}</b> — ${esc(c.role||"")}${c.location?" @ "+esc(c.location):""}</div>`).join("")+
    _field("save as new world","g_name",(w.name||"world").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),"input")+
    `<div class="row"><button onclick="createWorld()">Create &amp; switch</button><button class="ghost" onclick="rollWorld()">Reroll</button></div>`;
}
async function createWorld(){
  const name=$("g_name").value.trim(); if(!name||!window._rolled){return;}
  const r=await fetch("/api/generate/apply",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,world:window._rolled.world,cast:window._rolled.cast})});
  const j=await r.json();
  if(!r.ok){$("g_out").innerHTML+=`<div class="kind">⚠ ${esc(j.error||"failed")}</div>`;return;}
  await loadState(); addTurn("sys",`created & switched to '${esc(name)}'. type to begin.`);
}
async function editSettings(){
  const c=await (await fetch("/api/config")).json();
  const opt=(v,l)=>`<option value="${v}"${Math.abs((c.depth||0)-v)<0.01?" selected":""}>${l}</option>`;
  $("reader").innerHTML=`<div class="edit"><h2>⚙ Session</h2>`+
    `<label>realness depth (mirror → other)</label><select id="s_depth">`+opt(0,"0 · mirror (the world agrees)")+opt(0.5,"0.5 · in between")+opt(1,"1 · other (the world resists)")+`</select>`+
    `<label style="display:block;margin-top:8px"><input type="checkbox" id="s_world" ${c.world_rounds?"checked":""}> show the world round each turn (major NPCs take turns)</label>`+
    `<label style="display:block"><input type="checkbox" id="s_mech" ${c.mechanics?"checked":""}> dice — an impartial d20 on uncertain actions</label>`+
    `<div class="row"><button onclick="saveSettings()">Apply</button><button class="ghost" onclick="loadState()">Close</button></div></div>`;
}
async function saveSettings(){
  await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({depth:parseFloat($("s_depth").value),world_rounds:$("s_world").checked,mechanics:$("s_mech").checked})});
  addTurn("sys","session settings applied.");await loadState();
}
async function delNode(name){
  if(!confirm("Delete node “"+name+"”?")) return;
  await fetch("/api/node/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  await loadState(); $("reader").innerHTML="";
}
async function newWorld(){
  const name=(prompt("New world name:")||"").trim(); if(!name){await loadWorlds();return;}
  const r=await (await fetch("/api/new",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})})).json();
  if(r.ok) location.reload(); else {alert(r.error||"failed"); await loadWorlds();}
}
async function addThread(){
  const q=(prompt("New thread — the open dramatic question:")||"").trim(); if(!q) return;
  await fetch("/api/thread/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({thread:{question:q,status:"seeded",readiness:0.3}})});
  await loadState();
}
async function delThread(id){
  await fetch("/api/thread/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
  await loadState();
}

async function renderReader(st){
  const f=Object.entries(st.state||{}).map(([k,v])=>`<span class="fact"><b>${esc(k)}</b> ${esc(String(v))}</span>`).join("");
  const inMotion=(st.threads||[]).filter(t=>t.status!=="dormant");
  const plan=inMotion.map(t=>{
    const pct=Math.round((t.readiness||0)*100);
    return `<div class="thread"><a class="tctl" title="remove" onclick="delThread('${(t.id||'').replace(/'/g,"\\'")}')">✕</a>`+
           `<div class="tq">${esc(t.question)}</div>`+
           `<div class="tbar"><div class="tfill" style="width:${pct}%"></div></div>`+
           `<div class="tstatus">${esc(t.status)} · ${pct}%</div></div>`;
  }).join("");
  let ck="";
  try{const g=await (await fetch("/api/check")).json();
      if(g.findings&&g.findings.length) ck=`<div class="warn">⚠ ${g.findings.length} continuity note(s) — run 'loom check'</div>`;}catch(e){}
  $("reader").innerHTML=
    `<div class="kind">continuity</div><div class="facts">`+(f||`<span style="color:var(--muted)">no facts yet</span>`)+`</div>`+
    `<div class="kind" style="margin-top:14px">the plan · <a class="addlink" onclick="addThread()">＋ thread</a></div>`+
    (plan||`<span style="color:var(--muted);font-size:12px">nothing ripening yet</span>`)+ck;
}

async function loadGraph(){
  const g=await (await fetch("/api/graph")).json();
  const svg=$("graph"), W=600,H=400;
  const nodes=g.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i*1.9)*90,y:H/2+Math.sin(i*1.9)*90,vx:0,vy:0}));
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.name,i]));
  const links=g.links.filter(l=>l.from in idx&&l.to in idx).map(l=>({s:idx[l.from],t:idx[l.to]}));
  for(let it=0;it<320;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=1600/d2;
      let fx=f*dx/d,fy=f*dy/d;nodes[i].vx+=fx;nodes[i].vy+=fy;nodes[j].vx-=fx;nodes[j].vy-=fy;}
    for(const l of links){let a=nodes[l.s],b=nodes[l.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-95)*.02;
      let fx=f*dx/d,fy=f*dy/d;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
    for(const n of nodes){n.vx+=(W/2-n.x)*.003;n.vy+=(H/2-n.y)*.003;n.x+=n.vx*.82;n.y+=n.vy*.82;n.vx*=.82;n.vy*=.82;
      n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(24,Math.min(H-24,n.y));}
  }
  let s="";
  for(const l of links)s+=`<line class="edge" x1="${nodes[l.s].x}" y1="${nodes[l.s].y}" x2="${nodes[l.t].x}" y2="${nodes[l.t].y}"/>`;
  for(const n of nodes){const c=KINDS[n.kind]||KINDS.lore;
    s+=`<g class="node" onclick="openNode('${n.name.replace(/'/g,"")}')"><circle cx="${n.x}" cy="${n.y}" r="${7+n.name.length*0.25}" fill="${c}"/>`+
       `<text x="${n.x+10}" y="${n.y+4}">${esc(n.name)}</text></g>`;}
  svg.innerHTML=s;
  $("worldcount").textContent=`${nodes.length} nodes · ${links.length} links`;
  $("legend").innerHTML=Object.entries(KINDS).map(([k,c])=>`<span style="color:${c};margin-left:8px">●</span>${k}`).join("");
}

function addTurn(role,text){
  const d=document.createElement("div");d.className="turn "+role;
  d.innerHTML = role==="narrator" ? mdToHtml(text) : esc(text);
  $("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight;
}

function addWorld(turns){
  const d=document.createElement("div");d.className="turn meanwhile";
  d.style.cssText="font-size:13px;color:#9a94a8;border-left:2px solid #443c55;padding:6px 12px;margin:6px 0";
  d.innerHTML="<div style='font-variant:small-caps;letter-spacing:.5px;color:#7a7488;margin-bottom:4px'>meanwhile, elsewhere</div>"
    +turns.map(t=>`<div style='margin:2px 0'><b>${esc((t.who||[]).join(", ")||"someone")}</b>${t.where?` <span style='opacity:.7'>@ ${esc(t.where)}</span>`:""} — ${esc(t.beat)}</div>`).join("");
  $("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight;
}

async function loadWorlds(){
  const w=await (await fetch("/api/worlds")).json();
  $("worldsel").innerHTML=(w.campaigns||[]).map(n=>`<option${n===w.active?" selected":""}>${esc(n)}</option>`).join("")+`<option value="__new__">＋ new world…</option>`;
}

async function loadState(){
  const st=await (await fetch("/api/state")).json();
  await loadWorlds();
  $("model").textContent=st.model.replace(/^https?:\/\//,"");
  $("log").innerHTML="";
  for(const e of st.transcript) addTurn(e.role,e.text);
  if(!st.transcript.length) addTurn("sys","A blank page. Type below to begin — the world is listening.");
  await renderReader(st);
  await loadGraph();
}

$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const t=$("input").value.trim();if(!t)return;
  $("input").value="";addTurn("player",t);
  $("send").disabled=true;$("mdot").className="dot";
  addTurn("sys","…the world stirs…");
  const think=$("log").lastChild;
  try{
    const r=await fetch("/api/turn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:t})});
    const j=await r.json();think.remove();
    if(r.ok){addTurn("narrator",j.narrator);if(j.world&&j.world.length)addWorld(j.world);$("mdot").className="dot ok";await loadGraph();}
    else{addTurn("sys","⚠ "+(j.error||"the narrator is silent")+"  (is ./serve.sh running?)");$("mdot").className="dot bad";}
  }catch(e){think.remove();addTurn("sys","⚠ "+e);$("mdot").className="dot bad";}
  $("send").disabled=false;$("input").focus();
});

$("consolidate").addEventListener("click",async()=>{
  addTurn("sys","reading the session into canon…");
  const p=await (await fetch("/api/consolidate",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(p.error){addTurn("sys","⚠ "+p.error);return;}
  const names=(p.nodes||[]).map(n=>n.name);
  const stateKeys=Object.keys(p.state||{});
  const tnew=(p.threads_new||[]).map(t=>t.question);
  const tres=(p.threads_resolved||[]);
  const cu=(p.character_updates||[]);
  const disp=cu.filter(c=>c.disposition).map(c=>c.name);
  const moveNames=cu.filter(c=>c.location).map(c=>c.name);
  const moves=cu.filter(c=>c.location).map(c=>`${c.name} → ${esc(String(c.location))}`);
  if(!names.length&&!stateKeys.length&&!tnew.length&&!tres.length&&!cu.length){addTurn("sys","nothing new to fold in.");return;}
  const msg=`Fold into canon?\n\ncanon: ${names.join(", ")||"—"}\nstate: ${stateKeys.join(", ")||"—"}\nnew threads: ${tnew.join("  |  ")||"—"}\nresolved: ${tres.join(", ")||"—"}\ndispositions: ${disp.join(", ")||"—"}\nmoves: ${moves.join(", ")||"—"}\n\n${p.summary||""}`;
  if(!confirm(msg))return;
  await fetch("/api/consolidate/apply",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({proposals:p,approved_nodes:names,approved_state:stateKeys,approved_threads:tnew,approved_resolved:tres,approved_dispositions:disp,approved_locations:moveNames})});
  addTurn("sys",`folded: +${names.length} node(s), +${tnew.length} thread(s), ${tres.length} resolved.`);
  await loadState();
});

$("imagine").addEventListener("click",async()=>{
  addTurn("sys","dreaming a new thread from the canon…");
  const r=await (await fetch("/api/imagine",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(r.error){addTurn("sys","⚠ "+r.error);return;}
  const cands=r.candidates||[];
  if(!cands.length){addTurn("sys","nothing coherent surfaced — try again.");return;}
  if(!confirm("Bless these imagined threads into the plan?\n\n"+cands.map(c=>"• "+c.question).join("\n\n")))return;
  const res=await (await fetch("/api/imagine/bless",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({candidates:cands,approved_ids:cands.map(c=>c.id)})})).json();
  addTurn("sys",`blessed ${(res.added||[]).length} dreamed thread(s) into the plan.`);
  await loadState();
});

$("sleep").addEventListener("click",async()=>{
  addTurn("sys","the world turns while you're away…");
  const j=await (await fetch("/api/sleep",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(j.recap)addTurn("sys","— while you were away —\n"+j.recap);
  else if(j.error)addTurn("sys","⚠ "+j.error);
  else addTurn("sys","nothing came due; the world waits as you left it.  (raise depth in ⚙ to let it move.)");
  await loadState();
});

$("worldsel").addEventListener("change",async()=>{
  if($("worldsel").value==="__new__"){ newWorld(); return; }
  await fetch("/api/use",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("worldsel").value})});
  location.reload();
});
loadState();
</script>
</body>
</html>
