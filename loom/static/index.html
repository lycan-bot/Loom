<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loom</title>
<style>
  :root{
    --bg:#0f1013; --panel:#16181d; --panel2:#1b1e25; --border:#262a31;
    --text:#d7dae0; --muted:#868c98; --accent:#c9905a;
    --place:#4ea1a1; --character:#6f8fd8; --faction:#d8a34e; --event:#d87a6a; --lore:#8a8f98;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{margin:0;font-size:16px;letter-spacing:.5px;color:var(--accent);font-weight:600}
  header .meta{color:var(--muted);font-size:12px}
  header .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:5px;vertical-align:middle}
  header .dot.ok{background:#5aa469} header .dot.bad{background:#c0564a}
  .wrap{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 45px)}
  .story{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
  #log{flex:1;overflow-y:auto;padding:18px 22px}
  .turn{margin:0 0 18px}
  .turn.player{color:var(--muted)}
  .turn.player::before{content:"› ";color:var(--accent)}
  .turn.narrator{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;color:#e7e3da}
  .turn.narrator p{margin:0 0 .8em}
  .turn.sys{color:var(--event);font-size:12px;font-style:italic}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--panel)}
  #input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
         border-radius:6px;padding:9px 11px;font:inherit;resize:none}
  button{background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:0 16px;
         font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .world{display:flex;flex-direction:column;min-width:0}
  .worldbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
  svg{width:100%;flex:1;display:block;background:radial-gradient(circle at 50% 40%,#14161c,#0f1013)}
  .node circle{cursor:pointer;stroke:#0f1013;stroke-width:1.5}
  .node text{fill:var(--text);font-size:11px;pointer-events:none}
  .edge{stroke:#333944;stroke-width:1}
  #reader{height:38%;border-top:1px solid var(--border);overflow-y:auto;padding:14px 18px;background:var(--panel)}
  #reader h2{margin:0 0 4px;font-size:14px;color:var(--accent)}
  #reader .kind{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  #reader .body{font-family:Georgia,serif;font-size:14px;line-height:1.65;color:#ded9cf}
  #reader .body p{margin:0 0 .7em}
  #reader a{color:var(--place);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--place)}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .fact{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:12px}
  .fact b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>loom</h1>
  <span class="meta" id="campaign">…</span>
  <span class="meta" style="margin-left:auto"><span class="dot" id="mdot"></span><span id="model">…</span></span>
</header>
<div class="wrap">
  <section class="story">
    <div id="log"></div>
    <form id="f">
      <input id="input" autocomplete="off" placeholder="What do you do?">
      <button id="send" type="submit">Send</button>
      <button id="consolidate" class="ghost" type="button" title="Fold this session into canon">Consolidate</button>
    </form>
  </section>
  <section class="world">
    <div class="worldbar"><span id="worldcount">world</span><span style="margin-left:auto" id="legend"></span></div>
    <svg id="graph" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="reader"><div class="kind">continuity</div><div id="facts" class="facts"></div></div>
  </section>
</div>
<script>
const KINDS={place:"#4ea1a1",character:"#6f8fd8",faction:"#d8a34e",event:"#d87a6a",lore:"#8a8f98"};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $=id=>document.getElementById(id);

function mdToHtml(t){
  t=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
          .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,n,a)=>`<a onclick="openNode('${n.replace(/'/g,"")}')">${a||n}</a>`);
  return t.split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}

async function openNode(name){
  const r=await fetch("/api/node?name="+encodeURIComponent(name));
  if(!r.ok) return;
  const n=await r.json();
  $("reader").innerHTML=`<h2>${esc(n.name)}</h2><div class="kind">${esc(n.kind)}</div>`+
    `<div class="body">${mdToHtml(n.body)}</div>`;
}

function drawFacts(state){
  const f=Object.entries(state).map(([k,v])=>`<span class="fact"><b>${esc(k)}</b> ${esc(String(v))}</span>`).join("");
  $("reader").innerHTML=`<div class="kind">continuity</div><div class="facts">`+(f||`<span style="color:var(--muted)">no continuity facts yet</span>`)+`</div>`;
}

async function loadGraph(){
  const g=await (await fetch("/api/graph")).json();
  const svg=$("graph"), W=600,H=400;
  const nodes=g.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i*1.9)*90,y:H/2+Math.sin(i*1.9)*90,vx:0,vy:0}));
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.name,i]));
  const links=g.links.filter(l=>l.from in idx&&l.to in idx).map(l=>({s:idx[l.from],t:idx[l.to]}));
  for(let it=0;it<320;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=1600/d2;
      let fx=f*dx/d,fy=f*dy/d;nodes[i].vx+=fx;nodes[i].vy+=fy;nodes[j].vx-=fx;nodes[j].vy-=fy;}
    for(const l of links){let a=nodes[l.s],b=nodes[l.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-95)*.02;
      let fx=f*dx/d,fy=f*dy/d;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
    for(const n of nodes){n.vx+=(W/2-n.x)*.003;n.vy+=(H/2-n.y)*.003;n.x+=n.vx*.82;n.y+=n.vy*.82;n.vx*=.82;n.vy*=.82;
      n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(24,Math.min(H-24,n.y));}
  }
  let s="";
  for(const l of links)s+=`<line class="edge" x1="${nodes[l.s].x}" y1="${nodes[l.s].y}" x2="${nodes[l.t].x}" y2="${nodes[l.t].y}"/>`;
  for(const n of nodes){const c=KINDS[n.kind]||KINDS.lore;
    s+=`<g class="node" onclick="openNode('${n.name.replace(/'/g,"")}')"><circle cx="${n.x}" cy="${n.y}" r="${7+n.name.length*0.25}" fill="${c}"/>`+
       `<text x="${n.x+10}" y="${n.y+4}">${esc(n.name)}</text></g>`;}
  svg.innerHTML=s;
  $("worldcount").textContent=`${nodes.length} nodes · ${links.length} links`;
  $("legend").innerHTML=Object.entries(KINDS).map(([k,c])=>`<span style="color:${c};margin-left:8px">●</span>${k}`).join("");
}

function addTurn(role,text){
  const d=document.createElement("div");d.className="turn "+role;
  d.innerHTML = role==="narrator" ? mdToHtml(text) : esc(text);
  $("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight;
}

async function loadState(){
  const st=await (await fetch("/api/state")).json();
  $("campaign").textContent="campaign · "+st.campaign;
  $("model").textContent=st.model.replace(/^https?:\/\//,"");
  $("log").innerHTML="";
  for(const e of st.transcript) addTurn(e.role,e.text);
  if(!st.transcript.length) addTurn("sys","A blank page. Type below to begin — the world is listening.");
  drawFacts(st.state);
  await loadGraph();
}

$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const t=$("input").value.trim();if(!t)return;
  $("input").value="";addTurn("player",t);
  $("send").disabled=true;$("mdot").className="dot";
  addTurn("sys","…the world stirs…");
  const think=$("log").lastChild;
  try{
    const r=await fetch("/api/turn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:t})});
    const j=await r.json();think.remove();
    if(r.ok){addTurn("narrator",j.narrator);$("mdot").className="dot ok";await loadGraph();}
    else{addTurn("sys","⚠ "+(j.error||"the narrator is silent")+"  (is ./serve.sh running?)");$("mdot").className="dot bad";}
  }catch(e){think.remove();addTurn("sys","⚠ "+e);$("mdot").className="dot bad";}
  $("send").disabled=false;$("input").focus();
});

$("consolidate").addEventListener("click",async()=>{
  addTurn("sys","reading the session into canon…");
  const p=await (await fetch("/api/consolidate",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(p.error){addTurn("sys","⚠ "+p.error);return;}
  const names=(p.nodes||[]).map(n=>n.name);
  const stateKeys=Object.keys(p.state||{});
  const tnew=(p.threads_new||[]).map(t=>t.question);
  const tres=(p.threads_resolved||[]);
  if(!names.length&&!stateKeys.length&&!tnew.length&&!tres.length){addTurn("sys","nothing new to fold in.");return;}
  const msg=`Fold into canon?\n\ncanon: ${names.join(", ")||"—"}\nstate: ${stateKeys.join(", ")||"—"}\nnew threads: ${tnew.join("  |  ")||"—"}\nresolved: ${tres.join(", ")||"—"}\n\n${p.summary||""}`;
  if(!confirm(msg))return;
  await fetch("/api/consolidate/apply",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({proposals:p,approved_nodes:names,approved_state:stateKeys,approved_threads:tnew,approved_resolved:tres})});
  addTurn("sys",`folded: +${names.length} node(s), +${tnew.length} thread(s), ${tres.length} resolved.`);
  await loadState();
});

loadState();
</script>
</body>
</html>
