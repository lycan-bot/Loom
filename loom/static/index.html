<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loom</title>
<style>
  :root{
    --bg:#0f1013; --panel:#16181d; --panel2:#1b1e25; --border:#262a31;
    --text:#d7dae0; --muted:#868c98; --accent:#c9905a;
    --place:#4ea1a1; --character:#6f8fd8; --faction:#d8a34e; --event:#d87a6a; --lore:#8a8f98;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{margin:0;font-size:16px;letter-spacing:.5px;color:var(--accent);font-weight:600}
  header .meta{color:var(--muted);font-size:12px}
  #worldsel{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:2px 6px;font:inherit;font-size:12px;cursor:pointer}
  header .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:5px;vertical-align:middle}
  header .dot.ok{background:#5aa469} header .dot.bad{background:#c0564a}
  .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 252px;grid-template-rows:minmax(0,1fr);height:calc(100vh - 45px)}
  .story{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;min-height:0}
  #log{flex:1;min-height:0;overflow-y:auto;padding:18px 22px}
  .turn{margin:0 0 18px}
  .turn.player{color:var(--muted)}
  .turn.player::before{content:"› ";color:var(--accent)}
  .turn.narrator{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;color:#e7e3da}
  .turn.narrator p{margin:0 0 .8em}
  .turn.sys{color:var(--event);font-size:12px;font-style:italic}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--panel)}
  #input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
         border-radius:6px;padding:9px 11px;font:inherit;resize:none}
  button{background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:0 16px;
         font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  /* center: the detail / continuity pane */
  .detail{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;min-height:0}
  .detailbar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
  .detailbar a{cursor:pointer}
  .detailbar a.on{color:var(--accent)}
  /* right: the categorized card rail */
  .rail{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
  .railbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
  #cards{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 16px}
  .tier{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;margin:13px 6px 3px;opacity:.75}
  .card{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .card:hover{background:var(--panel2)}
  .card.active{background:var(--panel2);border-color:var(--border)}
  .card .cdot{width:8px;height:8px;border-radius:50%;flex:none}
  .card .cname{color:var(--text);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .chint{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;max-width:44%;text-align:right}
  .card .pin{color:var(--accent);font-size:9px;flex:none}
  /* the node map, now a pop-up */
  svg{width:100%;display:block;background:radial-gradient(circle at 50% 40%,#14161c,#0f1013)}
  .node circle{cursor:pointer;stroke:#0f1013;stroke-width:1.5}
  .node text{fill:var(--text);font-size:11px;pointer-events:none}
  .edge{stroke:#333944;stroke-width:1}
  .modal{position:fixed;inset:0;background:rgba(8,9,11,.72);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .modalpanel{width:min(88vw,880px);height:min(82vh,640px);background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
  .modalbar{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
  .modalpanel svg{flex:1;min-height:0}
  #reader{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;background:var(--panel)}
  #reader h2{margin:0 0 4px;font-size:14px;color:var(--accent)}
  #reader .kind{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  #reader .body{font-family:Georgia,serif;font-size:14px;line-height:1.65;color:#ded9cf}
  #reader .body p{margin:0 0 .7em}
  #reader a{color:var(--place);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--place)}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .fact{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:12px}
  .fact b{color:var(--accent);font-weight:600}
  .thread{margin:8px 0}
  .tq{font-size:12.5px;color:var(--text);line-height:1.35}
  .tbar{height:4px;background:var(--panel2);border-radius:3px;margin:4px 0 2px;overflow:hidden}
  .tfill{height:100%;background:var(--accent)}
  .tstatus{font-size:11px;color:var(--muted)}
  .warn{margin-top:12px;color:var(--event);font-size:12px}
  .crow{font-size:12.5px;margin:3px 0;color:var(--text)}
  .clabel{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;margin-right:4px}
  .mini{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:1px 7px;font:inherit;font-size:11px;cursor:pointer;margin-left:10px}
  .tctl{float:right;cursor:pointer;color:var(--muted);font-size:12px}
  .tctl a{color:var(--muted);cursor:pointer}
  .addlink{cursor:pointer;color:var(--accent)}
  .edit label{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin:9px 0 2px}
  .edit input,.edit select,.edit textarea{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px;font:inherit;font-size:13px}
  .edit textarea{min-height:120px;resize:vertical;font-family:Georgia,serif;line-height:1.5}
  .edit .row{display:flex;gap:8px;margin-top:12px}
  /* the threads board (quest-book style) + the memories record */
  .qcard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin:8px 0}
  .qcard .qq{font-size:13px;color:var(--text);line-height:1.4}
  .qcard .qbar{height:4px;background:var(--bg);border-radius:3px;margin:7px 0 3px;overflow:hidden}
  .qcard .qfill{height:100%;background:var(--accent)}
  .qcard .qmeta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .qcard .qseed{font-size:11.5px;color:var(--muted);margin-top:6px;font-style:italic;line-height:1.45}
  .qcard.done{opacity:.55}
  .qcard.done .qfill{background:var(--place)}
  .memh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 6px}
  .memh:first-child{margin-top:2px}
  .ev{font-size:12.5px;margin:4px 0;color:var(--text);cursor:pointer;border-bottom:1px dotted transparent}
  .ev:hover{color:var(--accent)}
  .ev .evk{color:var(--muted);font-size:10px;margin-right:6px;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <h1>loom</h1>
  <select id="worldsel" class="meta" title="switch world"></select>
  <select id="modesel" class="meta" title="degrees of freedom — how much the world bends to you" style="margin-left:6px"></select>
  <a class="mini" style="margin-left:14px" onclick="editPlayer()" title="Your character in this world">You</a>
  <a class="mini" style="margin-left:12px" onclick="genWorld()" title="Roll a new world from a prompt">✦ Generate</a>
  <a class="mini" style="margin-left:12px" onclick="openOracle()" title="Oracle — out-of-character assistant & world-craft">◍ Oracle</a>
  <a class="mini" style="margin-left:12px" onclick="editSettings()" title="Depth, world round, dice">⚙</a>
  <span class="meta" style="margin-left:auto"><span class="dot" id="mdot"></span><span id="model">…</span></span>
</header>
<div class="wrap">
  <section class="story">
    <div id="log"></div>
    <form id="f">
      <input id="input" autocomplete="off" placeholder="What do you do?">
      <button id="send" type="submit">Send</button>
      <button id="continue" class="ghost" type="button" title="Continue the last narration" disabled>⤵ Continue</button>
      <button id="retry" class="ghost" type="button" title="Re-roll the last turn" disabled>↻ Retry</button>
      <button id="undo" class="ghost" type="button" title="Take back the last turn" disabled>↩ Undo</button>
      <button id="consolidate" class="ghost" type="button" title="Fold this session into canon">Consolidate</button>
      <button id="imagine" class="ghost" type="button" title="Dream a new thread from the canon">Imagine</button>
      <button id="sleep" class="ghost" type="button" title="Let the world turn while you're away">Sleep</button>
    </form>
  </section>
  <section class="detail">
    <div class="detailbar"><a id="tab_cont" class="on" onclick="showContinuity()">◆ continuity</a><a id="tab_threads" onclick="showThreads()">✦ threads</a><a id="tab_mem" onclick="showMemories()">◷ memories</a><span id="detailwhat" style="margin-left:auto;opacity:.7"></span></div>
    <div id="reader"><div class="kind">continuity</div><div id="facts" class="facts"></div></div>
  </section>
  <section class="rail">
    <div class="railbar"><span id="worldcount">world</span><a class="mini" onclick="openGraph()" title="Open the node map">🗺 map</a><a class="mini" onclick="editNode('')" title="Add a canon node">＋</a></div>
    <div id="cards"></div>
  </section>
</div>
<div class="modal" id="graphmodal" onclick="if(event.target===this)closeGraph()">
  <div class="modalpanel">
    <div class="modalbar"><b style="color:var(--accent)">node map</b><span id="legend"></span><a class="mini" style="margin-left:auto" onclick="closeGraph()">✕ close</a></div>
    <svg id="graph" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>
<div class="modal" id="oraclemodal" onclick="if(event.target===this)closeOracle()">
  <div class="modalpanel" style="width:min(80vw,620px);height:min(82vh,680px)">
    <div class="modalbar"><b style="color:var(--accent)">◍ Oracle</b><span style="opacity:.7">out-of-character · asks &amp; world-craft (proposals only)</span><a class="mini" style="margin-left:auto" onclick="closeOracle()">✕ close</a></div>
    <div id="oraclelog" style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px"></div>
    <form id="oracleform">
      <input id="oracleinput" autocomplete="off" placeholder="Ask about the world, or 'add a tavern called the Gull'…" style="flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 11px;font:inherit">
      <button type="submit">Ask</button>
    </form>
  </div>
</div>
<script>
const KINDS={place:"#4ea1a1",character:"#6f8fd8",faction:"#d8a34e",event:"#d87a6a",lore:"#8a8f98"};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $=id=>document.getElementById(id);
let CFG={};        // cached session config (whether narration streams, etc.)
let _active=null;  // name of the card currently shown in the detail pane

// ---- the card rail: the cast + world, tiered by salience ----
async function loadCards(){
  let tiers=[];
  try{tiers=(await (await fetch("/api/cards")).json()).tiers||[];}catch(e){return;}
  let h="";
  for(const t of tiers){
    if(!t.cards||!t.cards.length)continue;
    h+=`<div class="tier">${esc(t.label)}</div>`;
    for(const c of t.cards){
      const col=KINDS[c.kind]||KINDS.lore;
      h+=`<div class="card" data-name="${esc(c.name)}" onclick="openNode('${c.name.replace(/'/g,"")}')">`+
         `<span class="cdot" style="background:${col}"></span>`+
         `<span class="cname">${esc(c.name)}</span>`+
         (c.overridden?`<span class="pin" title="pinned tier">📌</span>`:"")+
         (c.hint?`<span class="chint">${esc(c.hint)}</span>`:"")+`</div>`;
    }
  }
  $("cards").innerHTML=h||`<div class="tier">no cast yet — write or generate a world</div>`;
  if(_active)_markActive(_active);
}
function _setTab(id){["tab_cont","tab_threads","tab_mem"].forEach(t=>$(t).classList.toggle("on",t===id));}
function _clearCards(){document.querySelectorAll('.card').forEach(el=>el.classList.remove('active'));}
function _markActive(name){_active=name;document.querySelectorAll('.card').forEach(el=>el.classList.toggle('active',el.dataset.name===name));}
function _openDetail(name,kind){_active=name;_setTab(null);$("detailwhat").textContent=(kind?kind+" · ":"")+name;_markActive(name);}
function _detailMode(what){_active=null;_setTab(null);$("detailwhat").textContent=what||"";_clearCards();}
function showContinuity(){_active=null;$("detailwhat").textContent="";_clearCards();if(window._st)renderReader(window._st);}
async function showThreads(){_active=null;_clearCards();_setTab("tab_threads");$("detailwhat").textContent="";await renderThreads();}
async function showMemories(){_active=null;_clearCards();_setTab("tab_mem");$("detailwhat").textContent="";await renderMemories();}

// the threads board — every thread as a quest-book card, grouped by momentum (keep the 'threads' name)
async function renderThreads(){
  let ths=[];try{ths=(await (await fetch("/api/threads")).json()).threads||[];}catch(e){}
  const groups=[["in motion",t=>t.status!=="dormant"&&t.status!=="resolved"&&t.status!=="imagined"],
                ["waiting",t=>t.status==="dormant"||t.status==="imagined"],
                ["resolved",t=>t.status==="resolved"]];
  let h=`<h2>the threads</h2><div class="kind">the open questions that pull the story · <a class="addlink" onclick="addThread()">＋ thread</a></div>`;
  let any=false;
  for(const [label,pred] of groups){
    const g=ths.filter(pred); if(!g.length)continue; any=true;
    h+=`<div class="memh">${label}</div>`;
    for(const t of g){
      const pct=Math.round((t.readiness||0)*100), done=t.status==="resolved";
      h+=`<div class="qcard${done?" done":""}">`+
         (done?"":`<a class="tctl" title="remove" onclick="delThread('${(t.id||'').replace(/'/g,"\\'")}')">✕</a>`)+
         `<div class="qq">${esc(t.question)}</div>`+
         `<div class="qbar"><div class="qfill" style="width:${pct}%"></div></div>`+
         `<div class="qmeta">${esc(t.status)} · ${pct}%${(t.entities&&t.entities.length)?" · "+t.entities.map(esc).join(", "):""}</div>`+
         ((t.seed||t.payoff)?`<div class="qseed">${t.seed?"seed: "+esc(t.seed):""}${(t.seed&&t.payoff)?" → ":""}${t.payoff?esc(t.payoff):""}</div>`:"")+`</div>`;
    }
  }
  $("reader").innerHTML=h+(any?"":`<div style="color:var(--muted);font-size:12px;margin-top:10px">no threads yet — they open as you play, or add one.</div>`);
}

// the memories record — what's true, what's happened (events + closed arcs), the archive size
async function renderMemories(){
  const st=window._st||{};
  const facts=Object.entries(st.state||{}).map(([k,v])=>`<span class="fact"><b>${esc(k)}</b> ${esc(String(v))}</span>`).join("");
  let ths=[];try{ths=(await (await fetch("/api/threads")).json()).threads||[];}catch(e){}
  const resolved=ths.filter(t=>t.status==="resolved");
  let g={nodes:[]};try{g=await (await fetch("/api/graph")).json();}catch(e){}
  const events=(g.nodes||[]).filter(n=>n.kind==="event");
  const rep=(st.reputation||[]).filter(r=>r&&r.who);
  let h=`<h2>memories</h2><div class="kind">what the world remembers — the consolidated record</div>`;
  const mem=(st.memory||"").trim();
  if(mem){h+=`<div class="memh">what the narrator holds in mind</div><div class="body" style="white-space:pre-wrap;font-size:12.5px;color:#cbc6bc">${esc(mem)}</div>`;}
  h+=`<div class="memh">what's true now</div>`+(facts?`<div class="facts">${facts}</div>`:`<span style="color:var(--muted);font-size:12px">nothing recorded yet</span>`);
  if(rep.length){h+=`<div class="memh">how the world regards you</div>`+rep.map(r=>{const col=r.standing>0?"#7fd18a":r.standing<0?"#d67f7f":"var(--muted)";return `<div style="font-size:12.5px"><b style="color:${col}">${esc(r.label)}</b> · ${esc(r.who)}</div>`;}).join("");}
  if(events.length){h+=`<div class="memh">what's happened</div>`+events.map(n=>`<div class="ev" onclick="openNode('${n.name.replace(/'/g,"")}')"><span class="evk">event</span>${esc(n.name)}</div>`).join("");}
  if(resolved.length){h+=`<div class="memh">closed arcs</div>`+resolved.map(t=>`<div class="ev" style="cursor:default"><span class="evk">✓</span>${esc(t.question)}</div>`).join("");}
  h+=`<div class="memh">the archive</div><div style="font-size:12.5px;color:var(--muted)">${(g.nodes||[]).length} nodes remembered · <a class="addlink" onclick="openGraph()">open the map</a></div>`;
  $("reader").innerHTML=h;
}
// the node map, as a pop-up
async function openGraph(){await loadGraph();$("graphmodal").classList.add("open");}
function closeGraph(){$("graphmodal").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeGraph();closeOracle();}});

// ---- Oracle: the out-of-character assistant (lives OUTSIDE the seal; proposals only) ----
let ORACLE=[];   // OOC history — kept client-side, NEVER written to the sealed transcript/canon
function openOracle(){$("oraclemodal").classList.add("open");
  if(!ORACLE.length)_oracleSay("assistant",`<div style="font-size:13.5px;line-height:1.55">I'm <b>Oracle</b> — your out-of-character guide. Ask me about the world or how the game works, or tell me to craft something (a place, a character, a thread). Anything I change, <b>you approve first</b>.</div>`);
  setTimeout(()=>$("oracleinput").focus(),0);}
function closeOracle(){$("oraclemodal").classList.remove("open");}
function _oracleSay(role,html){const d=document.createElement("div");d.style.cssText="margin:0 0 13px";
  d.innerHTML=(role==="user")?`<div style="color:var(--muted);font-size:12.5px">› ${esc(html)}</div>`:html;
  $("oraclelog").appendChild(d);$("oraclelog").scrollTop=$("oraclelog").scrollHeight;return d;}
async function sendOracle(msg){
  ORACLE.push({role:"user",text:msg});_oracleSay("user",msg);
  const think=_oracleSay("assistant",`<span style="color:var(--muted)">…thinking…</span>`);
  try{
    const r=await fetch("/api/assist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,history:ORACLE.slice(0,-1)})});
    const j=await r.json();think.remove();
    if(!r.ok){_oracleSay("assistant",`<span style="color:var(--event)">⚠ ${esc(j.error||"unreachable")}  (is ./serve.sh running?)</span>`);return;}
    ORACLE.push({role:"assistant",text:j.reply});_oracleReply(j);
  }catch(e){think.remove();_oracleSay("assistant","⚠ "+esc(String(e)));}
}
function _oracleReply(j){
  const d=_oracleSay("assistant",`<div style="font-size:13.5px;line-height:1.55">${mdToHtml(j.reply)}</div>`);
  for(const a of (j.actions||[])){
    const label=a.type==="create_node"?`＋ create ${esc(a.kind)} “${esc(a.name)}”`:a.type==="add_thread"?`✦ add this thread`:a.type==="set_config"?`⚙ apply these settings`:"apply";
    const wrap=document.createElement("div");wrap.style.cssText="margin-top:6px";
    const btn=document.createElement("button");btn.className="ghost";btn.style.cssText="font-size:12px";btn.innerHTML=label;
    btn.onclick=async()=>{btn.disabled=true;try{await applyOracleAction(a);btn.textContent="✓ applied";}catch(e){btn.textContent="⚠ failed";btn.disabled=false;}};
    wrap.appendChild(btn);
    const preview=a.type==="add_thread"?a.question:a.type==="set_config"?`depth ${a.depth??"—"}, dice ${("mechanics"in a)?(a.mechanics?"on":"off"):"—"}`:a.body||"";
    if(preview){const p=document.createElement("div");p.style.cssText="font-size:11.5px;color:var(--muted);font-style:italic;margin-top:3px";p.textContent=preview;wrap.appendChild(p);}
    d.appendChild(wrap);
  }
}
// apply a PROPOSED action through the same gated endpoints the author UI uses (the player's click = consent)
async function applyOracleAction(a){
  if(a.type==="create_node")
    await fetch("/api/node/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:a.name,kind:a.kind,body:a.body,fields:a.fields||{}})});
  else if(a.type==="add_thread")
    await fetch("/api/thread/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({thread:{question:a.question,seed:a.seed,payoff:a.payoff,status:"seeded",readiness:0.3}})});
  else if(a.type==="set_config"){const c={};if("depth"in a)c.depth=a.depth;if("mechanics"in a)c.mechanics=a.mechanics;
    await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});CFG={...CFG,...c};}
  await loadState();   // reflect the new node/thread/setting in the rail + panels
}
// after a turn: refresh state + map + rail; keep continuity live but never clobber an open card
async function refreshWorld(){
  try{window._st=await (await fetch("/api/state")).json();}catch(e){return;}
  if(!_active) await renderReader(window._st);

function mdToHtml(t){
  t=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
          .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,n,a)=>`<a onclick="openNode('${n.replace(/'/g,"")}')">${a||n}</a>`);
  return t.split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}

async function loadGraph(){
  const g=await (await fetch("/api/graph")).json();
  const svg=$("graph"), W=600,H=400;
  const nodes=g.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i*1.9)*90,y:H/2+Math.sin(i*1.9)*90,vx:0,vy:0}));
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.name,i]));
  const links=g.links.filter(l=>l.from in idx&&l.to in idx).map(l=>({s:idx[l.from],t:idx[l.to]}));
  for(let it=0;it<320;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=1600/d2;
      let fx=f*dx/d,fy=f*dy/d;nodes[i].vx+=fx;nodes[i].vy+=fy;nodes[j].vx-=fx;nodes[j].vy-=fy;}
    for(const l of links){let a=nodes[l.s],b=nodes[l.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-95)*.02;
      let fx=f*dx/d,fy=f*dy/d;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
    for(const n of nodes){n.vx+=(W/2-n.x)*.003;n.vy+=(H/2-n.y)*.003;n.x+=n.vx*.82;n.y+=n.vy*.82;n.vx*=.82;n.vy*=.82;
      n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(24,Math.min(H-24,n.y));}
  }
  let s="";
  for(const l of links)s+=`<line class="edge" x1="${nodes[l.s].x}" y1="${nodes[l.s].y}" x2="${nodes[l.t].x}" y2="${nodes[l.t].y}"/>`;
  for(const n of nodes){const c=KINDS[n.kind]||KINDS.lore;
    s+=`<g class="node" onclick="openNode('${n.name.replace(/'/g,"")}')"><circle cx="${n.x}" cy="${n.y}" r="${7+n.name.length*0.25}" fill="${c}"/>`+
       `<text x="${n.x+10}" y="${n.y+4}">${esc(n.name)}</text></g>`;}
  svg.innerHTML=s;
  $("worldcount").textContent=`${nodes.length} nodes`; $("worldcount").title=`${links.length} links`;
  $("legend").innerHTML=Object.entries(KINDS).map(([k,c])=>`<span style="color:${c};margin-left:8px">●</span>${k}`).join("");
}

// stream a turn over SSE — tokens appear live in a narrator bubble; a 'replace' event (the
// guard/referee correcting the text) swaps the bubble contents; the transcript only ever holds
// the finalized text the server committed.
async function streamTurn(t,think){
  const r=await fetch("/api/turn/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:t})});
  if(!r.ok||!r.body){const j=await r.json().catch(()=>({}));think.remove();addTurn("sys","⚠ "+(j.error||"the narrator is silent")+"  (is ./serve.sh running?)");$("mdot").className="dot bad";return;}
  think.remove();
  const bub=document.createElement("div");bub.className="turn narrator";$("log").appendChild(bub);
  let acc="";const setBub=x=>{bub.innerHTML=mdToHtml(x)||"…";$("log").scrollTop=$("log").scrollHeight;};
  const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){
    const {value,done}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n\n"))>=0){
      const frame=buf.slice(0,idx);buf=buf.slice(idx+2);
      let ev="message",data="";
      for(const line of frame.split("\n")){
        if(line.startsWith("event:"))ev=line.slice(6).trim();
        else if(line.startsWith("data:"))data+=line.slice(5).trim();
      }
      let d={};try{d=JSON.parse(data);}catch(e){continue;}
      if(ev==="token"){acc+=d.t;setBub(acc);}
      else if(ev==="replace"){acc=d.text;setBub(acc);}                 // guard/referee corrected the on-screen text
      else if(ev==="world"){if(d.world&&d.world.length)addWorld(d.world);}
      else if(ev==="done"){acc=d.narrator;setBub(acc);$("mdot").className="dot ok";$("undo").disabled=false;$("continue").disabled=false;$("retry").disabled=false;await refreshWorld();}
      else if(ev==="error"){bub.remove();addTurn("sys","⚠ "+(d.error||"stream failed")+"  (is ./serve.sh running?)");$("mdot").className="dot bad";}
    }
  }
}

      const j=await r.json();think.remove();
      if(r.ok){addTurn("narrator",j.narrator);if(j.world&&j.world.length)addWorld(j.world);$("mdot").className="dot ok";$("undo").disabled=false;$("continue").disabled=false;$("retry").disabled=false;await refreshWorld();}
      else{addTurn("sys","⚠ "+(j.error||"the narrator is silent")+"  (is ./serve.sh running?)");$("mdot").className="dot bad";}
    }
  }catch(e){think.remove();addTurn("sys","⚠ "+e);$("mdot").className="dot bad";}
  $("send").disabled=false;$("input").focus();
});

$("undo").addEventListener("click",async()=>{
  if(!confirm("Take back the last turn? This removes the last exchange and undoes its consequences."))return;
  $("undo").disabled=true;
  try{
    const j=await (await fetch("/api/undo",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
    if(j.undone){await loadState();addTurn("sys","↩ last turn taken back.");}
    else addTurn("sys","nothing to undo.");
  }catch(e){addTurn("sys","⚠ "+e);}
});

function replaceLastNarrator(text){
  const bubbles=$("log").querySelectorAll(".turn.narrator");
  const last=bubbles[bubbles.length-1];
  if(last){last.innerHTML=mdToHtml(text);$("log").scrollTop=$("log").scrollHeight;}
  else addTurn("narrator",text);
}
$("continue").addEventListener("click",async()=>{
  $("continue").disabled=true;$("mdot").className="dot";
  addTurn("sys","…the tale goes on…");const think=$("log").lastChild;
  try{
    const j=await (await fetch("/api/continue",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
    think.remove();
    if(j.error){addTurn("sys","⚠ "+j.error+"  (is ./serve.sh running?)");$("mdot").className="dot bad";}
    else if(j.narrator){replaceLastNarrator(j.narrator);$("mdot").className="dot ok";}
    else addTurn("sys","nothing to continue.");
  }catch(e){think.remove();addTurn("sys","⚠ "+e);$("mdot").className="dot bad";}
  $("continue").disabled=false;$("input").focus();
});
$("retry").addEventListener("click",async()=>{
  if(!confirm("Re-roll the last turn? This discards the current narration and generates a fresh one."))return;
  $("retry").disabled=true;$("mdot").className="dot";
  addTurn("sys","…re-rolling the moment…");const think=$("log").lastChild;
  try{
    const j=await (await fetch("/api/retry",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
    think.remove();
    if(j.error){addTurn("sys","⚠ "+j.error+"  (is ./serve.sh running?)");$("mdot").className="dot bad";}
    else if(j.narrator){await loadState();if(j.world&&j.world.length)addWorld(j.world);$("mdot").className="dot ok";}
    else addTurn("sys","nothing to retry.");
  }catch(e){think.remove();addTurn("sys","⚠ "+e);$("mdot").className="dot bad";}
  $("retry").disabled=false;$("input").focus();
});

$("consolidate").addEventListener("click",async()=>{
  addTurn("sys","reading the session into canon…");
  const p=await (await fetch("/api/consolidate",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(p.error){addTurn("sys","⚠ "+p.error);return;}
  const names=(p.nodes||[]).map(n=>n.name);
  const stateKeys=Object.keys(p.state||{});
  const tnew=(p.threads_new||[]).map(t=>t.question);
  const tres=(p.threads_resolved||[]);
  const cu=(p.character_updates||[]);
  const disp=cu.filter(c=>c.disposition).map(c=>c.name);
  const moveNames=cu.filter(c=>c.location).map(c=>c.name);
  const moves=cu.filter(c=>c.location).map(c=>`${c.name} → ${esc(String(c.location))}`);
  const rep=(p.reputation||[]).filter(r=>r&&r.who);
  const repNames=rep.map(r=>r.who);
  const repShow=rep.map(r=>`${r.who} ${r.delta>0?"+"+r.delta:r.delta}${r.because?" ("+r.because+")":""}`);
  if(!names.length&&!stateKeys.length&&!tnew.length&&!tres.length&&!cu.length&&!rep.length){addTurn("sys","nothing new to fold in.");return;}
  const msg=`Fold into canon?\n\ncanon: ${names.join(", ")||"—"}\nstate: ${stateKeys.join(", ")||"—"}\nnew threads: ${tnew.join("  |  ")||"—"}\nresolved: ${tres.join(", ")||"—"}\ndispositions: ${disp.join(", ")||"—"}\nmoves: ${moves.join(", ")||"—"}\nreputation: ${repShow.join("  |  ")||"—"}\n\n${p.summary||""}`;
  if(!confirm(msg))return;
  await fetch("/api/consolidate/apply",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({proposals:p,approved_nodes:names,approved_state:stateKeys,approved_threads:tnew,approved_resolved:tres,approved_dispositions:disp,approved_locations:moveNames,approved_reputation:repNames})});
  addTurn("sys",`folded: +${names.length} node(s), +${tnew.length} thread(s), ${tres.length} resolved.`);
  await loadState();
});

$("imagine").addEventListener("click",async()=>{
  addTurn("sys","dreaming a new thread from the canon…");
  const r=await (await fetch("/api/imagine",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(r.error){addTurn("sys","⚠ "+r.error);return;}
  const cands=r.candidates||[];
  if(!cands.length){addTurn("sys","nothing coherent surfaced — try again.");return;}
  if(!confirm("Bless these imagined threads into the plan?\n\n"+cands.map(c=>"• "+c.question).join("\n\n")))return;
  const res=await (await fetch("/api/imagine/bless",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({candidates:cands,approved_ids:cands.map(c=>c.id)})})).json();
  addTurn("sys",`blessed ${(res.added||[]).length} dreamed thread(s) into the plan.`);
  await loadState();
});

$("sleep").addEventListener("click",async()=>{
  addTurn("sys","the world turns while you're away…");
  const j=await (await fetch("/api/sleep",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(j.recap)addTurn("sys","— while you were away —\n"+j.recap);
  else if(j.error)addTurn("sys","⚠ "+j.error);
  else addTurn("sys","nothing came due; the world waits as you left it.  (raise depth in ⚙ to let it move.)");
  await loadState();
});

$("modesel").addEventListener("change",applyMode);
$("oracleform").addEventListener("submit",ev=>{ev.preventDefault();const m=$("oracleinput").value.trim();if(!m)return;$("oracleinput").value="";sendOracle(m);});
$("worldsel").addEventListener("change",async()=>{
  if($("worldsel").value==="__new__"){ newWorld(); return; }
  await fetch("/api/use",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("worldsel").value})});
  location.reload();
});
loadState();
</script>
